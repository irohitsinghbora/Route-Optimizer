<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Route Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚀 Route Planner</h1>

<button onclick="logout()">Logout</button>

<hr>

<h2>Add Location</h2>

<input type="text"
       id="locationName"
       placeholder="Enter location">

<button onclick="addLocation()">
    Add Location
</button>

<div id="locations"></div>

<hr>

<h2>Add Route</h2>

<input type="text"
       id="src"
       placeholder="Source">

<input type="text"
       id="dst"
       placeholder="Destination">

<input type="number"
       id="dist"
       placeholder="Distance">

<button onclick="addRoute()">
    Add Route
</button>

<div id="routes"></div>

<hr>

<h2>Find Paths</h2>

<input type="text"
       id="source"
       placeholder="Source">

<input type="text"
       id="dest"
       placeholder="Destination">

<button onclick="getPaths()">
    Find Paths
</button>

<hr>

<div id="paths"></div>

<script src="script.js"></script>

</body>
</html>
